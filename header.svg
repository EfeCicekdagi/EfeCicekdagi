  <rect x="540" y="113" width="120" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="600" y="148" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#cdeff7" letter-spacing="1.5">AI &amp; Data Engineer in the making
