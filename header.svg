  </defs>
  <path fill="url(#g)" d="M0,0 H1200 V180 C1000,240 820,150 600,190 C380,230 200,150 0,200 Z"/>
  <path fill="#00b4d8" opacity="0.18" d="M0,170 C200,130 380,210 600,175 C820,140 1000,215 1200,165 V195 C1000,240 820,160 600,200 C380,235 200,160 0,205 Z">
    <animate attributeName="opacity" values="0.1;0.28;0.1" dur="5s" repeatCount="indefinite"/>
  </path>
  <text x="600" y="95" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">Efe Çiçekdağı
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
